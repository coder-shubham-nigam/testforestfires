<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Predictor Form</title>
    <style>
        /* Base Dark Theme Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism Container */
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 87, 34, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.8s ease-out;
            max-width: 700px;
            width: 90%;
            margin: 20px 0;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #ff5722; 
            letter-spacing: 1px;
        }

        /* Form Grid Layout */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Input Fields */
        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff5722;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Button Styling */
        .btn-predict {
            grid-column: span 2; /* Make button span both columns */
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff5722, #d84315);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
            margin-top: 10px;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.5);
            background: linear-gradient(135deg, #ff7043, #e64a19);
        }

        /* Result Display Area */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 12px;
            color: #81c784;
            font-size: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .nav-link {
            display: inline-block;
            margin-top: 25px;
            color: #b0bec5;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #ff5722;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
            .btn-predict { grid-column: span 1; }
        }
        /* Secondary Button for Back to Home */
        .btn-secondary {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            color: #b0bec5;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border-color: #ff5722;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FWI Prediction Model</h1>        
        
        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <input type="text" name="Temperature" placeholder="Temperature (°C)" required="required" />
            <input type="text" name="RH" placeholder="Relative Humidity (%)" required="required" />
            <input type="text" name="Ws" placeholder="Wind Speed (km/h)" required="required" />
            <input type="text" name="Rain" placeholder="Rain (mm)" required="required" />
            <input type="text" name="FFMC" placeholder="FFMC Index" required="required" />
            <input type="text" name="DMC" placeholder="DMC Index" required="required" />
            <input type="text" name="ISI" placeholder="ISI Index" required="required" />
            <input type="text" name="Classes" placeholder="Classes (0 or 1)" required="required" />
            <input type="text" name="Region" placeholder="Region (0 or 1)" required="required" />
            
            <button type="submit" class="btn-predict">Predict FWI</button>
        </form>

        <!-- Only display the result box if a prediction result is returned -->
        <!-- Only display the result box if a prediction result is returned -->
        {% if result %}
        <div class="result-box">
            The Predicted FWI is: <strong>{{ result | round(2) }}</strong>
        </div>
        {% endif %}

        <a href="/" class="btn-secondary">← Back to Home</a>
    </div>
</body>
</html>
