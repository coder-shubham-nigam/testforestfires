<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction Portal</title>
    <style>
        /* Base Dark Theme Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Interactive Glassmorphism Container */
        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 87, 34, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 1.2s ease-out;
            max-width: 600px;
            width: 90%;
        }

        /* Typography */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #ff5722; 
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #b0bec5;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Interactive Button */
        .btn {
            display: inline-block;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff5722, #d84315);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        /* Button Hover Effects */
        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255, 87, 34, 0.5);
            background: linear-gradient(135deg, #ff7043, #e64a19);
        }

        /* Page Load Animation */
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(-30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forest Fire Prediction</h1>
        <p>Harness the power of Machine Learning to forecast the Fire Weather Index (FWI) based on precise environmental data and meteorological metrics.</p>
        
        <a href="/predictdata" class="btn">Launch Predictor</a>
    </div>
</body>
</html>
